server.port=8088

spring.application.name=crudsure

# Conexión a MySQL Local
spring.datasource.url=jdbc:mysql://localhost:3306/crudsure_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
