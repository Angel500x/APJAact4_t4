info:
  name: Crear Producto (POST)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/productos"
  body:
    type: json
    data: |-
      {
        "nombre": "Laptop Gamer",
        "precio": 18500.50,
        "stock": 10,
        "categoriaId": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
