info:
  name: Listar Productos Paginado (GET)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/productos?page=0&size=5&sortBy=id"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "5"
      type: query
    - name: sortBy
      value: id
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
